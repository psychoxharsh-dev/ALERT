<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Bot Control Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1a1a1a);
    --hint: var(--tg-theme-hint-color, #7a7a7a);
    --card: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --ok: #2ea043;
    --bad: #d73a49;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px 12px 40px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
  }
  h1 { font-size: 18px; margin: 4px 0 2px; }
  .sub { color: var(--hint); font-size: 12px; margin-bottom: 12px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab {
    flex: 1; padding: 10px; border: 0; border-radius: 10px;
    background: var(--card); color: var(--text); font-size: 14px; font-weight: 600;
  }
  .tab.active { background: var(--btn); color: var(--btn-text); }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; color: #fff; }
  .badge.on { background: var(--ok); }
  .badge.off { background: var(--bad); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; text-align: center; }
  .stat { background: var(--bg); border-radius: 10px; padding: 8px 4px; }
  .stat b { display: block; font-size: 18px; }
  .stat span { font-size: 11px; color: var(--hint); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  label { display: block; font-size: 12px; color: var(--hint); margin-bottom: 4px; }
  input[type=number], input[type=text] {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid transparent;
    background: var(--bg); color: var(--text); font-size: 15px;
  }
  input:focus { outline: 2px solid var(--btn); }
  .section { font-size: 13px; font-weight: 700; margin-top: 16px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .toggle input { width: 22px; height: 22px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  button.act {
    padding: 12px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600;
    background: var(--btn); color: var(--btn-text);
  }
  button.act.green { background: var(--ok); color: #fff; }
  button.act.red { background: var(--bad); color: #fff; }
  button.act.full { grid-column: 1 / -1; }
  button.act:disabled { opacity: .5; }
  .note { font-size: 11px; color: var(--hint); margin-top: 10px; }
  pre {
    margin: 0; max-height: 220px; overflow: auto; font-size: 11px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
  }
  #err { display: none; background: var(--bad); color: #fff; padding: 12px; border-radius: 10px; margin-bottom: 12px; }
  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: #222; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90%;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
  <h1>🎛 Bot Control Panel</h1>
  <div class="sub">Time: <span id="time">--</span></div>
  <div id="err"></div>

  <div class="tabs">
    <button class="tab active" data-id="1">Bot 1</button>
    <button class="tab" data-id="2">Bot 2</button>
  </div>

  <div class="card">
    <div class="row">
      <b id="title">Bot 1</b>
      <span id="badge" class="badge off">Stopped</span>
    </div>
    <div class="stats">
      <div class="stat"><b id="c1">0</b><span>First msgs</span></div>
      <div class="stat"><b id="c2">0</b><span>Second msgs</span></div>
      <div class="stat"><b id="cu">0</b><span>Users</span></div>
    </div>
    <div class="btns">
      <button class="act green" id="btnStart">▶ Start</button>
      <button class="act red" id="btnStop">⏹ Stop</button>
      <button class="act full" id="btnOne">📨 Send 1 test message now</button>
    </div>
  </div>

  <div class="card">
    <div class="section" style="margin-top:0">💰 Amount</div>
    <div class="grid">
      <div><label>First Amount (₹)</label><input type="text" inputmode="decimal" id="firstAmount"></div>
      <div><label>Second Amount (₹)</label><input type="text" inputmode="decimal" id="secondAmount"></div>
    </div>

    <div class="section">⚡ Speed</div>
    <div class="grid">
      <div><label>Msgs / minute (1-20)</label><input type="number" id="messagesPerMinute"></div>
    </div>

    <div class="section">🕐 Run Time Gap (sec)</div>
    <div class="grid">
      <div><label>Min</label><input type="number" id="runTimeGapMin"></div>
      <div><label>Max</label><input type="number" id="runTimeGapMax"></div>
    </div>

    <div class="section">⏱ Second Msg Delay (sec)</div>
    <div class="grid">
      <div><label>Min</label><input type="number" id="secondMsgDelayMin"></div>
      <div><label>Max</label><input type="number" id="secondMsgDelayMax"></div>
    </div>

    <div class="section">🔁 User Repeat Time (sec)</div>
    <div class="grid">
      <div><label>Min</label><input type="number" id="repeatTimeMin"></div>
      <div><label>Max</label><input type="number" id="repeatTimeMax"></div>
    </div>

    <div class="section">🔘 Switches</div>
    <div class="toggle"><span>First message ON</span><input type="checkbox" id="firstMsg"></div>
    <div class="toggle"><span>Second message ON</span><input type="checkbox" id="secondMsg"></div>

    <div class="btns">
      <button class="act full" id="btnSave">💾 Save Settings</button>
    </div>
    <div class="note">Messages me "TEST PURPOSE NOT REAL IS FAKE" label fixed hai, change nahi hota.</div>
  </div>

  <div class="card">
    <div class="section" style="margin-top:0">📜 Logs</div>
    <pre id="logs">--</pre>
  </div>

  <div id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const FIELDS = [
  "firstAmount","secondAmount","messagesPerMinute",
  "runTimeGapMin","runTimeGapMax","secondMsgDelayMin","secondMsgDelayMax",
  "repeatTimeMin","repeatTimeMax"
];
const TOGGLES = ["firstMsg","secondMsg"];

let current = "1";
let state = null;
let loadedFor = {};   // bot id -> inputs filled already
let busy = false;

const $ = (id) => document.getElementById(id);

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function showErr(msg) {
  const e = $("err");
  if (!msg) { e.style.display = "none"; return; }
  e.textContent = msg;
  e.style.display = "block";
}

async function api(path, method = "GET", body) {
  const res = await fetch(path, {
    method,
    headers: {
      "Content-Type": "application/json",
      "X-Init-Data": tg.initData || ""
    },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("Error " + res.status));
  return data;
}

function fillInputs(force) {
  if (!state) return;
  if (!force && loadedFor[current]) return;
  const b = state.bots[current];
  FIELDS.forEach((f) => { $(f).value = b[f]; });
  TOGGLES.forEach((f) => { $(f).checked = !!b[f]; });
  loadedFor[current] = true;
}

function render() {
  if (!state) return;
  const b = state.bots[current];
  $("time").textContent = state.time;
  $("title").textContent = "Bot " + current;
  const badge = $("badge");
  badge.textContent = b.running ? "Running" : "Stopped";
  badge.className = "badge " + (b.running ? "on" : "off");
  $("c1").textContent = b.messageCount;
  $("c2").textContent = b.secondCount;
  $("cu").textContent = b.users;
  $("btnStart").disabled = b.running;
  $("btnStop").disabled = !b.running;
  const pre = $("logs");
  const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
  pre.textContent = state.logs.length ? state.logs.join("\n") : "Abhi koi log nahi";
  if (atBottom) pre.scrollTop = pre.scrollHeight;
  fillInputs(false);
}

async function refresh() {
  try {
    state = await api("/api/state");
    showErr("");
    render();
  } catch (e) {
    showErr(e.message);
  }
}

async function action(fn, okMsg) {
  if (busy) return;
  busy = true;
  try {
    const r = await fn();
    if (r && r.ok === false) toast("❌ " + (r.error || "Failed"));
    else toast(okMsg);
  } catch (e) {
    toast("❌ " + e.message);
  }
  busy = false;
  refresh();
}

document.querySelectorAll(".tab").forEach((t) => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
    t.classList.add("active");
    current = t.dataset.id;
    render();
  };
});

$("btnStart").onclick = () => action(() => api(`/api/bot/${current}/start`, "POST"), "✅ Started");
$("btnStop").onclick  = () => action(() => api(`/api/bot/${current}/stop`, "POST"), "🛑 Stopped");
$("btnOne").onclick   = () => action(() => api(`/api/bot/${current}/send-one`, "POST"), "📨 Sent");

$("btnSave").onclick = () => {
  const body = {};
  FIELDS.forEach((f) => { body[f] = $(f).value; });
  TOGGLES.forEach((f) => { body[f] = $(f).checked; });
  action(async () => {
    const r = await api(`/api/bot/${current}/settings`, "POST", body);
    if (r.ok) { loadedFor[current] = false; }
    return r;
  }, "💾 Saved");
};

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
